
name: BeejRakshak - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build BeejRakshak APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Download source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Accept licenses safely
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "Android SDK license acceptance failed"
            exit "$SDK_STATUS"
          fi

      # Install Android packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Check tools
      - name: Verify build environment
        run: |
          java -version
          node --version
          npm --version
          sdkmanager --version

      # Install JavaScript dependencies
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      # Build web app
      - name: Build BeejRakshak web application
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      # Generate wrapper if missing
      - name: Prepare Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x gradlew
          ./gradlew --version

      # Compile Android
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # Confirm APK
      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK successfully generated"
          ls -lh "$APK"

      # Upload APK
      - name: Upload BeejRakshak APK
        uses: actions/upload-artifact@v4
        with:
          name: BeejRakshak-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Summary
      - name: Build summary
        if: always()
        run: |
          echo "## BeejRakshak Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job logs for the build result." >> "$GITHUB_STEP_SUMMARY"
