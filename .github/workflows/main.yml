
name: BeejRakshak Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile BeejRakshak
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify environment
        run: |
          java -version
          node --version
          npm --version
          sdkmanager --version

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Download Gradle
        run: |
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          /tmp/gradle-8.11.1/bin/gradle wrapper \
            --gradle-version 8.11.1

          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeejRakshak-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build report
        if: always()
        run: |
          echo "## BeejRakshak Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the build logs for the exact result." >> "$GITHUB_STEP_SUMMARY"
