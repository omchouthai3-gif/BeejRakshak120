name: Build BeejRakshak Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build BeejRakshak APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install Java
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 4. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"

      # 5. Install project dependencies
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # 6. Build React and Vite application
      - name: Build web application
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 7. Sync Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Ensure Gradle wrapper exists and is executable
      - name: Prepare Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            curl -fL \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      # 9. Compile Android APK
      - name: Build Android debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. Verify APK
      - name: Verify generated APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload BeejRakshak APK
        uses: actions/upload-artifact@v4
        with:
          name: BeejRakshak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Build summary
      - name: Build summary
        run: |
          {
            echo "## BeejRakshak APK Build"
            echo "APK compilation completed successfully."
            echo "Download \`BeejRakshak-debug-apk\` from Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
